<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>100 razones por las que te quiero ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #ff758c,
                #ff7eb3
            );

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        .contenedor {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .tarjeta {
            background: white;
            border-radius: 25px;
            padding: 35px 25px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        .corazon {
            font-size: 65px;
            animation: latido 1.3s infinite;
            margin-bottom: 10px;
        }

        h1 {
            color: #ff4f70;
            font-size: 27px;
            margin: 5px 0 25px;
        }

        .numero {
            color: #ff4f70;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .razon {
            min-height: 120px;

            display: flex;
            justify-content: center;
            align-items: center;

            color: #444;
            font-size: 21px;
            line-height: 1.5;
            padding: 10px;
        }

        .progreso-texto {
            color: #777;
            font-size: 14px;
            margin-top: 15px;
        }

        .barra {
            width: 100%;
            height: 10px;
            background: #eee;
            border-radius: 20px;
            overflow: hidden;
            margin: 10px 0 20px;
        }

        .barra-progreso {
            height: 100%;
            width: 1%;
            background: linear-gradient(
                90deg,
                #ff4f70,
                #ff8fab
            );

            border-radius: 20px;
            transition: width 0.5s ease;
        }

        button {
            border: none;
            background: #ff4f70;
            color: white;

            padding: 15px 25px;
            border-radius: 30px;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;

            box-shadow: 0 5px 15px rgba(255,79,112,0.3);

            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
            background: #ff365d;
        }

        button:active {
            transform: scale(0.97);
        }

        .mensaje-final {
            display: none;
        }

        .mensaje-final h2 {
            color: #ff4f70;
            font-size: 28px;
        }

        .mensaje-final p {
            color: #555;
            font-size: 19px;
            line-height: 1.6;
        }

        /* Corazones flotantes */

        .corazon-flotante {
            position: fixed;
            bottom: -50px;
            font-size: 25px;
            animation: subir 6s linear infinite;
            opacity: 0.7;
            z-index: 1;
        }

        @keyframes subir {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            20% {
                opacity: 0.8;
            }

            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        @keyframes latido {
            0% {
                transform: scale(1);
            }

            15% {
                transform: scale(1.15);
            }

            30% {
                transform: scale(1);
            }

            45% {
                transform: scale(1.12);
            }

            60% {
                transform: scale(1);
            }
        }

        /* Animación de cambio de razón */

        .aparecer {
            animation: aparecer 0.5s ease;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Adaptación para celular */

        @media (max-width: 500px) {

            .contenedor {
                padding: 15px;
            }

            .tarjeta {
                padding: 30px 20px;
            }

            h1 {
                font-size: 24px;
            }

            .corazon {
                font-size: 55px;
            }

            .razon {
                font-size: 19px;
                min-height: 130px;
            }

            button {
                width: 100%;
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <div class="tarjeta">

            <div class="corazon">
                ❤️
            </div>

            <h1>
                100 razones por las que te quiero
            </h1>

            <div id="contenido">

                <div class="numero" id="numero">
                    #1
                </div>

                <div class="razon" id="razon">
                    Porque llegaste a mi vida y la hiciste mucho más bonita. ❤️
                </div>

                <div class="progreso-texto" id="progresoTexto">
                    1 / 100
                </div>

                <div class="barra">
                    <div
                        class="barra-progreso"
                        id="barraProgreso">
                    </div>
                </div>

                <button onclick="siguienteRazon()">
                    ✨ Dame otra razón
                </button>

            </div>

            <div class="mensaje-final" id="mensajeFinal">

                <h2>
                    Llegaste al final ❤️
                </h2>

                <p>
                    Estas fueron 100 razones...
                    pero podría encontrar muchas más.
                </p>

                <p>
                    Porque quererte no se puede resumir
                    en una lista. ❤️
                </p>

                <div style="font-size: 45px;">
                    💕🥰💕
                </div>

            </div>

        </div>

    </div>


    <script>

        /*
        =====================================================
        100 RAZONES
        =====================================================
        */

        const razones = [

            "Porque llegaste a mi vida y la hiciste mucho más bonita. ❤️",

            "Porque contigo puedo ser completamente yo.",

            "Porque tu sonrisa tiene el poder de cambiar mi día.",

            "Porque me haces sentir especial.",

            "Porque contigo hasta los momentos simples se vuelven recuerdos bonitos.",

            "Porque me gusta compartir mi tiempo contigo.",

            "Porque siempre tienes una forma especial de hacerme sonreír.",

            "Porque me encanta tu manera de ser.",

            "Porque contigo siento que estoy en el lugar correcto.",

            "Porque haces que mis días sean mejores.",

            "Porque me gusta escucharte hablar de cualquier cosa.",

            "Porque cada momento contigo tiene algo especial.",

            "Porque me haces querer ser una mejor persona.",

            "Porque tu cariño significa muchísimo para mí.",

            "Porque me encanta cuando estamos juntos.",

            "Porque incluso cuando no hacemos nada, disfruto estar contigo.",

            "Porque contigo puedo crear recuerdos que quiero guardar para siempre.",

            "Porque me haces sentir acompañado.",

            "Porque me encanta verte feliz.",

            "Porque simplemente eres tú, y eso me encanta."

        ];


        /*
        =====================================================
        VARIABLES
        =====================================================
        */

        const TOTAL_RAZONES = razones.length;

        let razonActual = 1;

        let razonesMostradas = [];


        /*
        =====================================================
        RECUPERAR PROGRESO
        =====================================================
        */

        const progresoGuardado =
            localStorage.getItem("razonActual");

        const razonesGuardadas =
            localStorage.getItem("razonesMostradas");


        if (progresoGuardado !== null) {

            razonActual = parseInt(progresoGuardado);

        }


        if (razonesGuardadas !== null) {

            razonesMostradas =
                JSON.parse(razonesGuardadas);

        }


        /*
        =====================================================
        MOSTRAR RAZÓN
        =====================================================
        */

        function mostrarRazon() {

            if (razonActual > TOTAL_RAZONES) {

                mostrarFinal();

                return;
            }


            const numero =
                document.getElementById("numero");

            const razon =
                document.getElementById("razon");

            const progresoTexto =
                document.getElementById("progresoTexto");

            const barra =
                document.getElementById("barraProgreso");


            /*
            Buscar razones que todavía
            no hayan sido mostradas
            */

            let disponibles = [];

            for (let i = 0; i < razones.length; i++) {

                if (!razonesMostradas.includes(i)) {

                    disponibles.push(i);

                }

            }


            /*
            Si todavía existen razones disponibles
            */

            if (disponibles.length > 0) {

                const posicion =
                    Math.floor(
                        Math.random() * disponibles.length
                    );

                const indice =
                    disponibles[posicion];


                razonesMostradas.push(indice);


                razon.textContent =
                    razones[indice];

            }


            numero.textContent =
                "#" + razonActual;


            progresoTexto.textContent =
                razonActual + " / " + TOTAL_RAZONES;


            const porcentaje =
                (razonActual / TOTAL_RAZONES) * 100;


            barra.style.width =
                porcentaje + "%";


            /*
            Guardar progreso
            */

            localStorage.setItem(
                "razonActual",
                razonActual
            );


            localStorage.setItem(
                "razonesMostradas",
                JSON.stringify(razonesMostradas)
            );


            /*
            Animación
            */

            razon.classList.remove("aparecer");

            void razon.offsetWidth;

            razon.classList.add("aparecer");

        }


        /*
        =====================================================
        SIGUIENTE RAZÓN
        =====================================================
        */

        function siguienteRazon() {

            razonActual++;

            mostrarRazon();

        }


        /*
        =====================================================
        FINAL
        =====================================================
        */

        function mostrarFinal() {

            document.getElementById("contenido").style.display =
                "none";

            document.getElementById("mensajeFinal").style.display =
                "block";


            localStorage.setItem(
                "terminado",
                "true"
            );

        }


        /*
        =====================================================
        CORAZONES FLOTANTES
        =====================================================
        */

        function crearCorazon() {

            const corazon =
                document.createElement("div");

            corazon.classList.add(
                "corazon-flotante"
            );


            const corazones = [
                "❤️",
                "💕",
                "💗",
                "💖",
                "💓"
            ];


            corazon.textContent =
                corazones[
                    Math.floor(
                        Math.random() *
                        corazones.length
                    )
                ];


            corazon.style.left =
                Math.random() * 100 + "vw";


            corazon.style.animationDuration =
                (4 + Math.random() * 4) + "s";


            corazon.style.fontSize =
                (15 + Math.random() * 20) + "px";


            document.body.appendChild(
                corazon
            );


            setTimeout(() => {

                corazon.remove();

            }, 8000);

        }


        /*
        Crear corazones cada cierto tiempo
        */

        setInterval(
            crearCorazon,
            700
        );


        /*
        =====================================================
        INICIO
        =====================================================
        */

        mostrarRazon();

    </script>

</body>
</html>
